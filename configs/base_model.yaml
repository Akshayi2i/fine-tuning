# Base model and quantization (arch 9, 11).
# Read by training (SPEC_06), inference core (SPEC_07) and serving (SPEC_11).

model:
  # Pin the revision. A floating revision means two training runs can silently
  # use different weights, which makes a regression impossible to attribute.
  model_id: "Qwen/Qwen3-VL-8B-Instruct"
  # The Hub commit of 2025-10-15 (4 safetensors shards, 17.5 GB).
  # scripts/pod_bootstrap.sh downloads exactly this into local_dir.
  revision: "0c351dd01ed87e9c1b53cbc748cba10e6187ff3b"
  trust_remote_code: true
  # Where the pod holds the base weights. Everything that LOADS the base reads
  # them from here — training, the tokenizer, the merge, vLLM — and never from
  # the Hub. The directory may hold the model itself (config.json at its root),
  # a folder named after it (Qwen3-VL-8B-Instruct/ or Qwen/Qwen3-VL-8B-Instruct/),
  # or a Hugging Face cache (models--Qwen--Qwen3-VL-8B-Instruct/snapshots/<sha>).
  # FIDEON_BASE_MODEL_DIR overrides it. model_id and revision above remain the
  # model's IDENTITY, recorded in every manifest.
  local_dir: "/workspace/models"

# Base precision (arch 9). DEFAULT: LoRA on a bf16 base - the base is held in
# bf16 and never updated; only the LoRA adapters train. This is behavior/format
# adaptation on a model that already has strong document pretraining, not
# new-knowledge injection, which is what makes low-rank adaptation the right
# technique in the first place.
#
# Why bf16 rather than 4-bit NF4 (QLoRA): BOTH serving paths hold the base in
# bf16/fp16 - the merged model (SPEC_10) and vLLM's LoRA hot-swap (SPEC_11). An
# adapter trained against a 4-bit base learns a delta that partly compensates for
# quantization error in weights it is then never served against. bf16 removes
# that gap: you train on exactly the weights you serve. It also runs 20-40%
# faster per step (NF4 dequantizes on every matmul) and lets DeepSpeed ZeRO-3
# shard the base, which bitsandbytes 4-bit params do not do cleanly.
#
# Flip load_in_4bit to true on a VRAM-constrained pod. It saves ~11GB of base
# weights (~16GB -> ~5.5GB) at the cost of the mismatch and the speed above.
# See configs/deepspeed/zero3.json for the other way out of a VRAM ceiling.
quantization:
  load_in_4bit: false

  # Read ONLY when load_in_4bit is true. training/base_precision.py omits these
  # from the ms-swift command entirely under bf16, so the run log never carries
  # settings that describe nothing the run did.
  bnb_4bit_quant_type: "nf4"            # designed for how NN weights distribute
  bnb_4bit_use_double_quant: true       # also compresses the quantization constants
  bnb_4bit_compute_dtype: "bfloat16"

attention:
  # Inputs run to thousands of image tokens plus OCR text. Standard attention
  # memory grows with the square of sequence length; this makes it affordable.
  attn_implementation: "flash_attention_2"

vision:
  # THE single biggest cost/latency lever: image token count is a direct function
  # of page resolution. This value MUST be identical here, in corpus prep, and in
  # production inference - a mismatch means serving a distribution the model
  # never trained on. configs/inference/vllm_serving.yaml must match (asserted).
  max_image_long_side_px: 1792          # valid range 1536-2048 (arch 11)

  # Frozen by default. Unfreezing is an escalation through the arch 3 gate, and
  # even then it is LoRA-on-ViT, never a full fine-tune: full FT risks degrading
  # the pretrained OCR ability that the image-only pathway depends on.
  train_vit: false

sequence:
  # Set from the 95th-percentile token count measured across image + OCR + JSON
  # on the REAL corpus. Do not guess: too low silently truncates long Loss Runs
  # (dropping claim rows the model is then trained to omit); too high wastes
  # memory that could go to batch size.
  max_seq_len: 8192                     # TODO Phase 10: re-measure on real data
