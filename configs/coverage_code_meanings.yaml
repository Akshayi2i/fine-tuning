# Coverage-code meanings the model will be shown in place of today's printed names
# (accuracy plan, stage 2.3). The model picks one of these codes for every coverage it reads; today each
# code is shown with ONE carrier's printed name, which the model copied to invent coverages.
#
# For every code, fill in:
#   meaning:    one short, neutral sentence saying WHAT the coverage is (not how one carrier prints it).
#               e.g. HO_COV_A -> "Coverage A: the main dwelling structure."
#   tell_apart: (optional) how to tell it from a look-alike code,
#               e.g. "Section II liability assessment; the Section I property one is HO_LOSS_ASSESSMENT."
# Reference only - do not edit: shown_today (what the model sees now), printed_as (how the seed policies
# print it), note (the schema owners' note), used_by (lines that use a shared code).
#
# `shared` lists the X_ codes several lines use: fill those once. Each line then lists its own codes.

