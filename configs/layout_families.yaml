# Layout families - which LOBs share a visual grammar (IMPL-09 2.1; Fideon
# SPEC_09 §2.1 and §2.1a).
#
# WHY THIS EXISTS. A Workers' Comp declarations page is tabular (class codes,
# state schedules, rate tables). A D&O policy is dense prose (manuscript wording,
# claims-made triggers). A homeowners declarations page is a property schedule
# with a coverage A/B/C/D table. One adapter across all of them produces a
# mediocre average, or forgets the minority layouts outright.
#
# The grouping is by HOW THE PAGE LOOKS, not by insurance taxonomy: Commercial
# Auto sits with Workers' Comp because both are tabular schedules, not because
# they are related products.
#
# ONE TABLE, EVERY READER. This file is LOB_TO_LAYOUT_FAMILY
# (common.config.lob_to_layout_family): training uses it to decide which
# documents a family's adapter trains on, serving to decide which adapter a
# document reaches. A second copy would eventually disagree, and the symptom
# would be a document extracted by an adapter that never saw its layout.
#
# EVERY LINE IS LISTED, once: each of this repository's canonical line schemas
# is in exactly one family, or under `no_family`. A line in neither is unknown,
# and serving refuses it unless the caller asks for the base-model fallback.
# A line whose family has no promoted adapter, or that has no family, is read
# by the base model with no LoRA against _fallback.json, and the result says
# so (lob_fallback_used) - while the unified and policy releases are not yet
# retired, one of them answers first.
#
# KEYED BY THIS REPOSITORY'S LINE NAMES, the canonical schema file names. The
# authoritative keys are the 48 L1 codes of the main repository's
# config/lob_registry.yaml (Fideon SPEC_06 §9a), which five codes map to no
# family; neither file is in this repository. When they arrive this table is
# re-keyed to them (tests/test_layout_family_routing.py checks it then). Lines
# marked "by analogy" below are placed from SPEC_09 §2.1a's nearest ACORD code
# and should be confirmed against that crosswalk.

families:

  # Consumer declarations pages: coverage A/B/C/D tables, vehicle and driver
  # schedules, ACORD 80-90. The first family being trained.
  personal_lines:
    title: Personal Lines
    lobs:
      - homeowners             # HOME
      - personal_auto          # AUTOP (classic auto is read as personal auto)
      - dwelling_fire          # DFIRE
      - ocean_marine           # BOAT - watercraft
      - motorcycle             # CYCLE
      - recreational_vehicle   # RECV
      - personal_umbrella      # PUMBR

  # Tabular class codes, state schedules, rate tables, vehicle schedules.
  casualty_fleet:
    title: Casualty and Fleet
    lobs:
      - gl                     # CGL
      - auto                   # AUTOB (commercial auto; the client's file is auto.json)
      - wc                     # WORK (with ELIAB)
      - umbrella               # CUMBR

  # Multi-location schedules, coverage grids, valuation tables, floaters.
  property_pkg:
    title: Property and Package
    lobs:
      - property               # PROP, CFIRE
      - builders_risk          # BLDRK
      - business_owners        # BOP
      - bopgl                  # BOPGL
      - boppr                  # BOPPR
      - inland_marine          # INMRC
      - flood                  # FLOOD
      - agriculture_farm       # farm property (handoff item 4: agriculture_farm -> property_pkg)
      - commercial_package     # by analogy: SMP, the package series 140
      - equipment_breakdown    # by analogy: the property section series

  # Dense prose, claims-made declarations, retro dates, sublimits.
  exec_specialty:
    title: Executive and Specialty
    lobs:
      - directors_officers     # DO
      - professional_eo        # EO, PL, PLMSC
      - epli                   # EPLI
      - cyber                  # CYBER
      - crime_fidelity         # CRIM
      - surety                 # SURE
      - management_liability   # by analogy: D&O, EPLI and crime written together

  # Census tables, group and benefit schedules.
  benefits_misc:
    title: Benefits and Miscellaneous
    lobs:
      - group_accident_sickness   # GPACC
      - disability                # by analogy: benefit schedules
      - statutory_disability      # by analogy: benefit schedules

# Lines known to have no layout family (SPEC_06 §9a: five L1 codes map to
# None). None of this repository's lines yet; the base model reads them.
no_family: []
