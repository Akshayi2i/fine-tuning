# Foundation LoRA - trained across ALL doc types and ALL 3 modality regimes.
#
# HYPERPARAMETERS ARE SWEEP STARTING POINTS (arch 11/11a), not settled values.
# Tune them on the validation set. The sweep itself is DEFERRED until after the
# SPEC_15 pilot: 9-12 runs against 25-30 documents per type mostly measures noise.
#
# What this adapter is supposed to learn (arch 4): insurance terminology, table
# and checkbox reading, OCR-versus-image arbitration, JSON structural discipline,
# and the canonical field mapping. Those are all CROSS-TYPE behaviours, which is
# why they belong here rather than in a per-type adapter.

run_type: foundation

lora:
  rank: 64                    # broader behaviour space than per-type, needs capacity
  alpha: 128
  dropout: 0.05
  bias: "none"
  # Attention + feed-forward projections in every decoder layer, PLUS the
  # vision-language projector. The projector is where image evidence fuses with
  # language, making it the locus of OCR-versus-image arbitration (arch 9a).
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  include_vision_projector: true

optimization:
  learning_rate: 2.0e-4       # sweep range 1e-4 to 2e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03          # range 0.03 to 0.05
  num_train_epochs: 3         # range 2 to 3
  # Plain AdamW, fp32 states. Under bf16 LoRA (arch 9) only ~150-200M params
  # train at rank 64, so exact optimizer state costs ~1.4GB instead of ~0.35GB
  # for 8-bit - affordable, and it removes a second quantization approximation
  # from the loop. The old `paged_adamw_8bit` was a bitsandbytes QLoRA-ism whose
  # stated rationale ("survives memory spikes from long sequences") did not hold:
  # paging protects OPTIMIZER STATE, while the long-sequence spikes here are
  # activation and logit spikes, which a paged optimizer does not touch.
  # Switch to "paged_adamw_8bit" only alongside load_in_4bit on a tight pod.
  optim: "adamw_torch"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  weight_decay: 0.01
  max_grad_norm: 1.0

batch:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32       # per_device x accum x n_gpu = effective
  effective_batch_size: 32              # target 32 to 64; asserted at launch
  gradient_checkpointing: true          # ~30% more compute for a large VRAM saving
  bf16: true

evaluation:
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "field_f1"     # not val loss alone - loss can improve
                                        # while field extraction gets worse
  greater_is_better: true
  early_stopping_patience: 2

logging:
  logging_steps: 10
  report_to: []                         # set by env when MLflow/W&B is configured

# Fixed and recorded in the run manifest. Without it a run is not reproducible,
# and the first time your best model is one you cannot reproduce, that matters.
seed: 42

distributed:
  deepspeed_config: "configs/deepspeed/zero2.json"
