# The personal_lines adapter: the unified settings, plus its data mix.
#
# Everything not named here is unified.yaml's (common.config.training_config
# merges this over it), so the two cannot drift apart on LoRA, optimisation,
# batching or evaluation.

extends: unified

# Per line of business: which share of the line's TRAIN documents is synthetic,
# and which share is scanned (Fideon SPEC_09 amendment items 6 and 7).
# training.data_mix applies them in this scope's view of the corpus. Every real
# document always trains; the view picks the synthetic ones, one twin of every
# seed before a second of any. Validation and test are never sampled.
#
#   synthetic_fraction  synthetic / train documents of the line. 0.8 with 12
#                       real documents keeps 48 synthetic ones.
#   scanned_share       scanned / train documents of the line: the share of
#                       scanned policies the line sees in production.
#
# The two values at the top are the scope defaults; null there leaves the share
# unsteered (every synthetic document trains). A line's own value overrides
# the default; null under a line takes the default.
#
# Both are null until set, which trains exactly what it did before: all 152
# originals are scans and every synthetic copy is rendered from one, so a
# scanned share below 1 has no digital documents to reach it with yet - the
# view would say so and keep everything. Set scanned_share per line from the
# production share once it is known, and synthetic_fraction once the new
# training set shows how many twins a seed brings.
#
# The values used, and what each line came to, are recorded on the run
# manifest (data_stats.data_mix) and in the run's model card.
data_mix:
  synthetic_fraction: null
  scanned_share: null
  lines:
    homeowners: {synthetic_fraction: null, scanned_share: null}
    personal_auto: {synthetic_fraction: null, scanned_share: null}
    dwelling_fire: {synthetic_fraction: null, scanned_share: null}
    recreational_vehicle: {synthetic_fraction: null, scanned_share: null}
    personal_umbrella: {synthetic_fraction: null, scanned_share: null}
    ocean_marine: {synthetic_fraction: null, scanned_share: null}
    motorcycle: {synthetic_fraction: null, scanned_share: null}

# The input-mode mix: 50% OCR text and images, 20% corrupted OCR and images, 30%
# images only. Not set here, so the global default (common.constants.
# MODALITY_MIX) applies. A scope may set its own:
#
#   modality_mix: {ocr_plus_image: 0.5, noisy_ocr_image: 0.2, image_only: 0.3}
#
# Modes are drawn when the corpus is built, so a scope with its own mix trains
# on a corpus built with it (--scope personal_lines); a run on a corpus drawn
# with another mix is refused.
