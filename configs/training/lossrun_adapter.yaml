# Per-type LoRA for Loss Runs (dense repeating claim tables)
#
# Trains FRESH from the current promoted Foundation, every time - never
# continued from its own previous checkpoint (arch 12). Per-type adapters are
# small and cheap, so incremental training buys nothing, and starting fresh from
# a fixed, well-evaluated Foundation stops small errors stacking across cycles.
# It also gives every adapter version a clean dependency on exactly ONE
# Foundation version, which is what makes "why did this type regress" answerable.
#
# NOTE (arch 4b): ONE shared 'acord' adapter covers forms 25/125/140. Per-form
# adapters wait for 1000+ examples of a form AND evidence the shared adapter
# underperforms on it. Per-form schemas exist regardless - the classifier still
# has to select the right one.

run_type: per_type_adapter
doc_type: "lossrun"

# Resolved at launch from the registry; recorded in the run manifest as a
# hard dependency so query_registry can list what a Foundation bump invalidates.
foundation_version: null

lora:
  rank: 16                    # narrow specialisation: only the schema mapping
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  include_vision_projector: true

optimization:
  learning_rate: 7.0e-5       # sweep range 5e-5 to 1e-4; lower than Foundation
                              # because it builds on an already-stable base
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 4         # range 3 to 5; less data, so more passes
  optim: "paged_adamw_8bit"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  weight_decay: 0.01
  max_grad_norm: 1.0

batch:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  effective_batch_size: 16    # target 16 to 32
  gradient_checkpointing: true
  bf16: true

evaluation:
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "field_f1"
  greater_is_better: true
  early_stopping_patience: 2

logging:
  logging_steps: 10
  report_to: []

seed: 42

distributed:
  deepspeed_config: "configs/deepspeed/zero2.json"
