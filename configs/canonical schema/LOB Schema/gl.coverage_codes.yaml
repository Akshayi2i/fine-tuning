# SPEC_21 4.2.4 coverage codes of gl (schema 3.0.0, common model 1.1.0).
# Built from the CGL documents of 10 seed carriers (Diamond State Insurance Company, Gemini Insurance Company, Great American Insurance Company, Security Mutual Insurance Company, Sutton National, Third Coast Insurance Company, Travelers, USLI, Utica First Insurance Company, Western World Insurance Group)
# and, from 1.1.0, the CGL documents of 10 policy_CGL carrier folders (FORTEGRA, Great American, Hiscox, Indium, Johnson & Johnson, Liberty Mutual, McNeil & Company, Philadelphia Insurance Companies, Russell Bond, XS Broker),
# and, from 1.2.0, six more CGL documents in 4 folders (The Main Street America Group, Scottsdale Insurance Company, USLI,
# Utica First),
# read in place (seed golds not signed off yet), and the pre-SPEC_21 gl.json 1.5.0.
# aliases: coverage names AND limit captions as the documents print them (whitespace collapsed; a dash
# the text layer has no Unicode for is written '-'). ISO declarations print a CGL's limits as captions
# ('Each Occurrence Limit'), not as coverage names, so each caption is an alias of the coverage it
# limits: L1 codes a printed row by its name (fideon/l1/spec21.py coverage_code_for). Codes are
# LOB-prefixed (GL_); a coverage the common model shares across lines uses its X_ code
# (common_model.json fideon:shared_coverage_codes); shared: true marks those.
# carriers: how many of the 23 carrier folders (10 seed + 13 policy_CGL) print one of the code's names or
# captions in their CGL documents (first 8 pages of a seed, first 20 of a policy_CGL document).
# Endorsement-coverages (X_ADDITIONAL_INSURED, X_PRIMARY_NONCONTRIBUTORY, X_WAIVER_OF_SUBROGATION,
# GL_COVERAGE_EXTENSION, GL_SNOW_PLOW_OPERATIONS) are coverages granted by an endorsement: one coverages[] entry
# per endorsement form, coverage_name its printed title, form_refs its form number as printed in
# forms_and_endorsements[].form_number; usually no limits.
# replaces_codes: the gl 2.0.0 code of the same coverage, renamed to the common model 1.1.0 shared code in
# 3.0.0 (CR-GL-03; gl.crosswalk.yaml). The aliases here are gl's carrier and ISO form titles; the shared
# code's generic names are in common_model.json.
# GL_DAMAGE_TO_PREMISES_RENTED: the default limit type stays per_location (L1 uses a default only when it is the
# single one). A limit printed per fire ('Fire Damage (Any One Fire)') is per_occurrence in a gold; L1 does not yet
# read 'any one fire' as a printed qualifier (CR-GL-20).
