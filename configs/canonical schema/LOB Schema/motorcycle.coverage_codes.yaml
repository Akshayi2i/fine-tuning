# SPEC_21 4.2.4 coverage codes of motorcycle (schema 1.0.0, common model 1.0.0).
# Built from all 9 seed golds of 3 carriers (All State, Progressive, RT Specialty).
# aliases: coverage names as the seeds print them (whitespace collapsed; a dash the text layer has no
# Unicode for is written '-'). Codes are LOB-prefixed (MC_); a coverage the common model shares across
# lines uses its X_ code (common_model.json fideon:shared_coverage_codes); shared: true marks those.
# carriers: how many of the line's carriers print the coverage. replaces_draft_codes: codes used by the
# engine-test seed golds for the same coverage; those golds are re-coded at seed review (see CHANGELOG).
lob: motorcycle
schema_version: 1.0.0
common_model_version: 1.0.0
code_prefix: MC_
codes:
- code: MC_ACCESSORIES
  name: Accessories / optional equipment
  aliases:
  - ACCESSORIES
  - Accessory Coverage
  - Optional Equipment
  default_limit_types:
  - per_occurrence
  - other
  carriers: 3
- code: MC_GUEST_LIABILITY
  name: Guest Liability
  aliases:
  - Guest Liability
  default_limit_types:
  - per_person
  - per_accident
  carriers: 1
- code: MC_OPTIONAL_BASIC_ECONOMIC_LOSS
  name: Optional basic economic loss (OBEL)
  aliases:
  - OPT BASIC ECON LOSS
  - OPTIONAL BASIC ECON LOSS
  - Optional Basic Economic Loss
  default_limit_types:
  - per_person
  carriers: 2
  note: See CR-PA-01 (split X_PIP).
  replaces_draft_codes:
  - X_PIP
- code: MC_PASSENGER_LIABILITY
  name: PASSENGER LIABILITY
  aliases:
  - PASSENGER LIABILITY
  default_limit_types:
  - per_person
  - per_accident
  carriers: 1
- code: MC_PEDESTRIAN_PIP
