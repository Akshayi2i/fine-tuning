open_items:
  - item: Layout family for 19 L1 codes
    detail: >-
      SPEC_09 places none of these, so schema_lob, layout_family, adapter, lob_code,
      coverage_code_prefix and blocks_used are TBD until a family is assigned: reinsurance, annuities, long_term_care, statutory_disability, disability, title, aviation, energy, medical_malpractice, management_liability, environmental, agriculture_farm, builders_risk, construction, product_liability, classic_auto, personal_property, commercial_package, equipment_breakdown.
  - item: SPEC_06 group
    detail: >-
      LOB_TO_LAYOUT_FAMILY has a key group that must be pointed at health or group_accident_sickness.
      Both are benefits_misc with routing_key null until then.
  - item: LOB codes
    detail: >-
      SYNTHETIC_DATA_PROCESS.md section 2 gives batch codes for the seven personal lines and for gl, auto,
      wc, property and umbrella only. lob_code and coverage_code_prefix are TBD for every other code.
  - item: SPEC_06 routing keys for personal lines
    detail: >-
      LOB_TO_LAYOUT_FAMILY has keys only for homeowners (home) and personal_auto. dwelling_fire,
      motorcycle, recreational_vehicle, personal_umbrella and watercraft have routing_key null until
      SPEC_06 adds them.
  - item: blocks_used beyond the 22 described lines
    detail: >-
      blocks_used is TBD for business_owners, bopgl, boppr, surety, health and specialty although their
      family is known, and for every code without a family.
  - item: Seed-based additions to blocks_used
    detail: >-
      drivers for recreational_vehicle and watercraft, and locations (garaging) for personal_auto and
      motorcycle, are not named for those LOBs in the SPEC_21 section 4.2.2 tables. The seeds or the
      vehicles block need them. The project owner confirms.
  - item: Personal umbrella exposure schedules
    detail: >-
      Personal umbrella declarations often schedule residences, vehicles and watercraft. SPEC_21 lists
      only underlying_insurance and attachment for personal umbrella; whether locations, vehicles and
      watercraft join blocks_used is a project-owner decision.
  - item: Hold-out carrier per LOB
    detail: >-
      holdout_carrier is TBD for every code and is named by the project owner before schema work
      (SPEC_21 section 10.3; Lakshman review #22). Not possible today for epli (1 carrier), earthquake
      and crime_fidelity (no source PDFs). personal_umbrella and life have 2 carriers, so holding one out
      leaves a single training carrier. source_pdfs is TBD for codes outside the 22 described lines.
  - item: The other LOBs of the 38
    detail: >-
      SPEC_21 counts 38 LOBs; config/lob_registry.yaml has 48 codes. Which codes become schema LOBs is
      settled as their layout families are assigned.
  - item: Seed availability outside personal lines
    detail: >-
      The seed folder also holds PDFs for several non-personal lines (gl, wc, directors_officers,
      professional_eo, cyber, flood and others). seeds stays pending for them because the Common Model
      Developer Brief documents seeds for the personal lines only; set it to available when the project
      owner assigns those lines.
