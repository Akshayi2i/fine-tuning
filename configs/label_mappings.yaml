# Labels written for one line's schema, used under another's.
#
# Applied when training targets are built and when gold labels are scored
# (common.label_mapping), never to the stored labels. Only when the label has
# the source block and not the target one: a label written in the target
# format is used as it is.
#
# Per line: the block to move from and to, and per section where it goes and
# the fields renamed on the way. Fields are then kept only if the target schema
# defines them; the rest are dropped rather than guessed into a near neighbour.
#
# Example:
#   some_line:
#     from: source_block
#     to: some_line
#     sections:
#       vehicles:
#         to: vehicles
#         rename: {body_type: body_style}
#
# Empty. Classic auto used to be mapped here from the personal-auto block; it is
# now personal auto itself (common.lob.MERGED_LINES), so the Hagerty labels,
# written in the personal-auto format, are used as they are.
{}
