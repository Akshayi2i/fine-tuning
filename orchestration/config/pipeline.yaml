# Orchestration configuration (IMPL-13 §9).
#
# GPU class per stage, staging volume, retry policy, notification hooks.
# Secrets are NEVER here — they come from the environment only.

staging_volume:
  # Created in Phase 0. The controller refuses to launch a pod without it: a pod
  # with no volume writes to pod-local disk, terminates, and the work is gone
  # with every write having succeeded.
  volume_id_env: RUNPOD_VOLUME_ID
  mount_env: RUNPOD_VOLUME_MOUNT
  mount_default: /runpod-volume
  staging_prefix: /runpod-volume/staging

gpu_class_by_stage:
  # Keys are STAGE NAMES as the DAG names them. They used to be v1 lineage names
  # (train_foundation / train_adapter), which stage_training never asks for - it
  # asks for "training" - so every training pod silently fell back to L40S and
  # the A100-80G line described a card nothing requested.
  #
  # The deployment runs every GPU stage on ONE H200 SXM (141 GB) pod, in
  # process, inside tmux (orchestration/detach.py): OCR, training, checkpoint
  # selection, merge, calibration and the gate share the card, and each vLLM
  # engine is released before the next stage loads one. These classes are what
  # the (not yet wired) RunPodBackend would request per stage; OCR alone could
  # run on a cheaper card, but moving a corpus between pods costs more than it saves.
  preprocessing: H200-SXM
  dataset_build: H200-SXM
  training: H200-SXM
  checkpoint_eval: H200-SXM
  merge: H200-SXM
  quantize: H200-SXM
  calibrate: H200-SXM
  evaluation_gate: H200-SXM

# Per-scope overrides, applied over gpu_class_by_stage. A scope whose largest
# task cap is 32k (policy extraction) may not fit a card that a 20480-cap scope
# fits comfortably, and that is a property of the scope, not of the stage.
gpu_class_by_scope: {}

pod:
  # CUDA 12.8 / torch 2.8: the stack pyproject pins (vLLM 0.11.0 is built on
  # torch 2.8). Confirm the tag in RunPod's template list; any CUDA 12.8 devel
  # image with Python 3.11 works, since setup_pod.sh installs torch itself.
  image: runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04
  # The pod clones the repo fresh at a pinned commit; code is never resident on
  # a pod between jobs, so the manifest's commit is the only source of truth.
  clone_at_pinned_commit: true
  # finetune runs OCR, dataset build and training back to back, all GPU-bound.
  # Three launches would mean three cold starts and two Blob round trips of the
  # same corpus.
  single_pod_for_finetune: true

retry:
  max_attempts: 2
  backoff_seconds: 30
  # A gate block is not a transient failure and is never retried: retrying it
  # would be an override path with extra steps.
  retry_on_gate_block: false

defaults:
  # vLLM-native serving formats (arch v2.1 13a). bf16 alone until Phase 0 spike
  # item 9 verifies a decoder-only FP8 export loads and runs in vLLM; the v1
  # default produced GGUF files the serving endpoint could not load at all.
  formats: [bf16]

  # bf16, not fp16: the adapter trained in bf16 against a bf16 base, and FP8 is
  # quantized from this merge. fp16 would insert a precision change between
  # training and every serving format for no reason.
  dtype: bf16
  min_labels_per_type: 25
  keep_staging: false
  seed: 42

notifications:
  # Populated from env; empty means log-only.
  on_gate_block: []
  on_command_failure: []
  on_publish: []

deferred:
  # Both are BUILT. These flags control whether the pipeline runs them, which is
  # a separate question from whether they exist.
  #
  # The sweep is never a pipeline stage: 9-12 training runs is an operator
  # decision taken after the pilot, not something a build starts on its own. It
  # also refuses at pilot volume, where it would measure the split rather than
  # the hyperparameter (arch §11a).
  sweep: false
  # The quantization gate applies whenever per-format metrics are supplied to
  # `package`. Scoring each GGUF needs the IMPL-12 routine on a GPU, so until
  # then the stage warns rather than inventing numbers to judge (IMPL-10 §4).
  quant_threshold_gate: false
