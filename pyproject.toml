[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-extraction-finetuning"
version = "0.1.0"
description = "L3 VLM layer of the Fideon pipeline: Qwen3-VL-8B fine-tuned for insurance document extraction"
requires-python = ">=3.11"

# Deliberately thin. Heavy GPU dependencies live in optional extras so the data
# pipeline and the whole test suite install and run on a laptop.
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "jsonschema>=4.21,<5",
    "referencing>=0.33",
    "Jinja2>=3.1,<4",
    "typer>=0.12,<1",
    "structlog>=24.1",
]

[project.optional-dependencies]
# One group per job. The requirements-*.txt files at the repo root install the
# right groups per pod, in the right order - see scripts/setup_pod.sh.
data = [
    "azure-storage-blob>=12.19,<13", "pypdf>=4.0",
    # One pillow for every environment: it encodes and resizes the page images
    # the model trains on (rendered in the OCR environment) and is served.
    "pillow>=11,<12",
    # Page rasterisation for the image_only pathway. pypdf reads structure
    # but cannot render, so both are needed rather than either.
    # Capped to the line MinerU 1.x allows, so the OCR environment and the
    # training/serving one render pages with the same PyMuPDF: two renderers
    # are two sets of pixels.
    "PyMuPDF>=1.24,<1.25",
]

# MinerU, for stage 2 (OCR). The 1.x line: the code imports `magic_pdf` and reads
# the `magic-pdf` version into every ocr_meta.json, and MinerU 2.x renamed the
# package (`mineru`) and removed that module. [full] brings the layout and
# table models' runtime, torch included. The model weights themselves are a
# separate download (MinerU's own `magic-pdf.json` / models-download step).
# torch pinned to the training stack's 2.8 (CUDA 12.8): unpinned, [full] resolves
# to the newest torch, built for a newer CUDA than the pod's driver may run and
# never tested with MinerU 1.x — and OCR is GPU-only, so that fails outright.
ocr = ["magic-pdf[full]>=1.3,<2", "torch>=2.8,<2.9", "torchvision>=0.23,<0.24"]

# RunPod training pod. torch is pinned to the minor version vLLM 0.11 pins,
# because the finetune pipeline runs vLLM in the same process for checkpoint
# selection and calibration: one environment, one torch. flash-attn is NOT here
# - it must be built against the installed torch with --no-build-isolation,
# which pip cannot do from inside an extra (scripts/setup_pod.sh does it).
train = [
    "torch>=2.8,<2.9", "transformers>=4.57,<4.58", "peft>=0.11", "bitsandbytes>=0.45",
    "accelerate>=1.0", "deepspeed>=0.15", "ms-swift>=3.9,<4",
    # ms-swift's Qwen3-VL template needs it (Qwen's own image/video helpers).
    "qwen-vl-utils>=0.0.14",
]
# RunPod serving pod, and the training pod (see above). vLLM 0.11 is the first
# with Qwen3-VL, and it keeps `guided_decoding`, which later releases replace
# with `structured_outputs` - so the upper bound stays until model_runner moves.
# EXACT, and the same on both pods: calibration is fitted on the logprobs the
# training pod's vLLM produces, so serving must run the same build. 0.11.0 is
# the last 0.11 on torch 2.8, the torch the training stack is pinned to.
# transformers is capped too: vLLM 0.11.0 sets no upper bound, and unpinned the
# serving pod resolved transformers 5.x while training and calibration ran 4.57.
serve = ["vllm==0.11.0", "transformers>=4.57,<4.58"]
# FP8 / AWQ INT4 export (arch v2.1 13a), in an environment OF ITS OWN: llmcompressor
# needs datasets>=4 where ms-swift 3 needs <4, and its transformers range excludes
# the one vLLM 0.11 needs, so it cannot join the train or serve environments.
# Only needed once FP8 is verified; cycle 1 serves bf16 and exports nothing.
# (The PyPI name is `llmcompressor`; `llm-compressor` does not exist there.)
# torch pinned to the pod's CUDA 12.8 build, as for OCR: unpinned it resolved the
# newest torch, built for a CUDA the pod's driver may not run.
quantize = ["llmcompressor>=0.8", "torch>=2.8,<2.9"]
eval = ["numpy>=1.26", "scikit-learn>=1.4", "openpyxl>=3.1,<4"]  # openpyxl: testing/comparison.py workbooks
track = ["mlflow>=2.12"]
dev = [
    "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML",
    "types-jsonschema",
    # tests/test_dependency_locks.py checks each lock against these specifiers.
    "packaging>=23",
    # Two staging tests read the staged JSONL with pyarrow, as ms-swift does;
    # without it they are skipped rather than run.
    "pyarrow>=15",
]

[tool.setuptools]
packages = [
    "common", "artifact_registry", "registry_utils", "data_pipeline",
    "training", "inference_core", "evaluation", "calibration",
    "postprocessing", "serving", "testing", "orchestration", "pilot", "scripts",
    "data_pipeline.labeling.review_tool",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU (skipped in CI)",
    "azure: requires live Azure (skipped in CI; use the mock blob backend)",
    "slow: long-running",
]
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true          # heavy GPU deps are absent off-pod
