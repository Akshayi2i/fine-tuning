[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-extraction-finetuning"
version = "0.1.0"
description = "L3 VLM layer of the Fideon pipeline: Qwen3-VL-8B fine-tuned for insurance document extraction"
requires-python = ">=3.11"

# Deliberately thin. Heavy GPU dependencies live in optional extras so the data
# pipeline and the whole test suite install and run on a laptop.
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "jsonschema>=4.21,<5",
    "referencing>=0.33",
    "Jinja2>=3.1,<4",
    "typer>=0.12,<1",
    "structlog>=24.1",
]

[project.optional-dependencies]
data = [
    "azure-storage-blob>=12.19,<13", "pypdf>=4.0", "pillow>=10.2",
    # Page rasterisation for the image_only pathway. pypdf reads structure
    # but cannot render, so both are needed rather than either.
    "PyMuPDF>=1.24",
]

# RunPod only. flash-attn needs a CUDA toolchain and is the usual install
# failure - the Phase 0 spike exists partly to find that out early.
train = [
    "torch>=2.3", "transformers>=4.57", "peft>=0.11", "bitsandbytes>=0.43",
    "accelerate>=0.30", "deepspeed>=0.14", "trl>=0.9", "ms-swift>=3.9,<4",
    "flash-attn>=2.5; platform_system=='Linux'",
]
# RunPod serving pod. llm-compressor produces the FP8 and AWQ INT4 weights vLLM
# loads natively (arch v2.1 13a) - it replaces the llama.cpp toolchain on the
# serving path, which produced GGUF files vLLM cannot open. llama.cpp is still
# needed for an on-request edge export, but that is not installed here because
# it is not part of serving.
serve = ["vllm>=0.5", "llm-compressor>=0.3"]
eval = ["numpy>=1.26", "scikit-learn>=1.4"]
track = ["mlflow>=2.12"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML", "types-jsonschema"]

[tool.setuptools]
packages = [
    "common", "artifact_registry", "registry_utils", "data_pipeline",
    "training", "inference_core", "evaluation", "calibration",
    "postprocessing", "serving", "testing", "orchestration", "pilot", "scripts",
    "data_pipeline.labeling.review_tool",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU (skipped in CI)",
    "azure: requires live Azure (skipped in CI; use the mock blob backend)",
    "slow: long-running",
]
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true          # heavy GPU deps are absent off-pod
